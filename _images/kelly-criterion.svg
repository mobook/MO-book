<svg xmlns="http://www.w3.org/2000/svg" width="580" height="245" viewBox="0 0 580 245" role="img" aria-labelledby="title desc">
<title id="title">A wager with two outcomes</title><desc id="desc">A wager of one pays one plus b with probability p, and zero with probability one minus p.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#777"/></marker></defs>
<g stroke="#777" stroke-width="3" marker-end="url(#arrow)"><path d="M210 105 L303 57"/><path d="M210 140 L303 190"/></g>
<g fill="#999" stroke="#777"><circle cx="175" cy="122" r="38"/><circle cx="350" cy="46" r="38"/><circle cx="350" cy="199" r="38"/></g>
<g font-family="Arial,sans-serif" font-size="21" fill="#222"><text x="8" y="130">wager = 1</text><text x="255" y="63">p</text><text x="242" y="193">1−p</text><text x="404" y="54">payout = 1+b</text><text x="404" y="207">payout = 0</text></g>
<g font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="middle"><text x="175" y="130">1</text><text x="350" y="54">1+b</text><text x="350" y="207">0</text></g></svg>